<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Isaac & Everton — Nossa História</title>
<style>
:root{--ink:#17152c;--cream:#fff7e8;--pink:#ff6d86;--yellow:#ffc94b;--mint:#83dfc4;--blue:#64a9e8}
*{box-sizing:border-box} body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:#12132c;color:var(--ink);overflow:hidden}
button{font:inherit}.app{height:100dvh;max-width:1100px;margin:auto;position:relative;overflow:hidden;background:#bfe8ff}
.sky{position:absolute;inset:0 0 38%;background:linear-gradient(#85bfe8 0 58%,#bde4dc)}
.sun{position:absolute;width:92px;height:92px;border-radius:50%;background:#ffe486;right:10%;top:8%;box-shadow:0 0 0 14px rgba(255,228,134,.16)}
.cloud{position:absolute;width:110px;height:28px;border-radius:30px;background:rgba(255,255,255,.82)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:46px;height:46px;left:17px;bottom:6px}.cloud:after{width:58px;height:58px;right:13px;bottom:3px}.c1{left:7%;top:12%}.c2{right:28%;top:22%;transform:scale(.65)}
.world{position:absolute;left:0;right:0;bottom:0;height:72%;background:var(--ground,#70c4a4);transition:.5s}
.world.house{--ground:#d68c69}.world.park{--ground:#75bf77}.world.night{background:#9b9fd3!important}.world.night:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,#3d426c)}
.hills{position:absolute;left:-5%;right:-5%;bottom:22%;height:28%;background:#64ad72;border-radius:55% 55% 0 0/70% 70% 0 0}.house .hills{display:none}
.tree{position:absolute;bottom:24%;width:24px;height:90px;background:#805438;border-radius:8px}.tree:before{content:"";position:absolute;width:125px;height:125px;border-radius:50%;background:#4d9b68;left:-50px;bottom:34px}.tree.t1{left:10%}.tree.t2{left:78%;transform:scale(.8)}
.house-art{display:none}.house .house-art{display:block}.house-body{position:absolute;left:50%;bottom:21%;width:380px;height:230px;transform:translateX(-50%);background:#ffe3a6;border:5px solid #60495e}.roof{position:absolute;left:50%;bottom:430px;width:300px;height:180px;transform:translateX(-50%) rotate(45deg);background:#b95f63;border:7px solid #60495e}.door{position:absolute;width:80px;height:145px;bottom:0;left:150px;background:#69a6bd;border:6px solid #60495e}.door:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#ffd66a;right:12px;top:72px}.window{position:absolute;width:92px;height:85px;bottom:115px;background:#7dc4d8;border:6px solid #60495e}.window.l{left:20px}.window.r{right:20px}
.park-art{display:none}.park .park-art{display:block}.bench{position:absolute;bottom:35%;left:14%;width:150px;height:22px;border-radius:4px;background:#bd7651}.bench:before,.bench:after{content:"";position:absolute;top:-38px;width:120px;height:18px;background:#cf9867;border-radius:5px}.bench:after{top:-58px}.bench i{position:absolute;width:13px;height:50px;background:#69483d;top:10px}.bench i:first-child{left:12px}.bench i:last-child{right:12px}.fountain{position:absolute;bottom:28%;right:12%;width:130px;height:50px;border-radius:50%;background:#77b9bc;border:8px solid #d8eee7}.fountain:before{content:"";position:absolute;width:12px;height:90px;background:#77b9bc;bottom:25px;left:51px}.fountain:after{content:"";position:absolute;width:70px;height:70px;border:8px solid #fff9;border-bottom:0;border-radius:60px 60px 0 0;left:22px;bottom:72px}
.topbar{position:absolute;z-index:20;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}.brand{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:16px;padding:8px 14px;box-shadow:4px 4px 0 var(--ink)}.brand b{display:block;font-size:17px}.brand span{font-size:11px;letter-spacing:.12em}.stats{display:flex;gap:8px}.stat{background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 10px;box-shadow:3px 3px 0 var(--ink);font-size:14px}.stat b{color:#e84f72}
.player{position:absolute;z-index:10;left:40%;bottom:23%;width:72px;height:118px;transition:left .18s,bottom .18s}.player .head{position:absolute;width:58px;height:58px;border-radius:50%;background:#b8754d;left:7px;top:0;border:4px solid var(--ink)}.player .hair{position:absolute;width:66px;height:28px;border-radius:50px 50px 12px 12px;background:#3b2942;left:3px;top:-5px}.player .hair:after{content:"";position:absolute;width:28px;height:18px;background:#3b2942;right:-3px;top:12px;border-radius:50%}.player .body{position:absolute;width:68px;height:68px;border-radius:24px 24px 12px 12px;background:#ffd45a;left:2px;top:51px;border:4px solid var(--ink)}.player .body:after{content:"";position:absolute;width:9px;height:68px;background:#efb83d;left:25px}.leg{position:absolute;width:16px;height:27px;background:#5b4a75;bottom:-1px;border:3px solid var(--ink)}.leg.l{left:12px}.leg.r{right:12px}.arm{position:absolute;width:14px;height:50px;background:#b8754d;top:58px;border:3px solid var(--ink);border-radius:10px}.arm.l{left:-7px}.arm.r{right:-7px}
.everton{position:absolute;z-index:9;right:23%;bottom:24%;width:76px;height:124px}.everton .head{position:absolute;width:62px;height:62px;border-radius:50%;background:#8e5a3d;border:4px solid var(--ink);left:7px}.everton .hair{position:absolute;width:68px;height:25px;border-radius:50px 50px 14px 14px;background:#2c242b;left:4px}.everton .body{position:absolute;top:54px;width:70px;height:73px;border-radius:24px 24px 10px 10px;background:#5fa0bd;border:4px solid var(--ink);left:3px}.everton .leg{background:#31374e}.name-tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);padding:3px 8px;border-radius:8px;font-weight:bold;white-space:nowrap}
.dialogue{position:absolute;z-index:30;left:18px;right:18px;bottom:18px;min-height:138px;background:var(--cream);border:4px solid var(--ink);border-radius:20px 20px 12px 12px;padding:18px 18px 14px 112px;box-shadow:6px 6px 0 rgba(23,21,44,.28);transform:translateY(0);transition:.25s}.dialogue.hidden{transform:translateY(180px)}.avatar{position:absolute;left:14px;top:14px;width:80px;height:80px;border-radius:50%;background:#ffd45a;border:3px solid var(--ink);overflow:hidden}.avatar:before{content:"";position:absolute;width:58px;height:58px;border-radius:50%;background:#b8754d;left:11px;top:18px}.avatar:after{content:"";position:absolute;width:64px;height:25px;border-radius:40px 40px 10px 10px;background:#3b2942;left:8px;top:10px}.avatar.eve{background:#76bdd4}.avatar.eve:before{background:#8e5a3d}.avatar.eve:after{background:#2c242b}
.speaker{font-weight:bold;color:#e34e70;margin-bottom:5px}.text{font-size:18px;line-height:1.35;min-height:44px}.choices{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.choice{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink);font-weight:bold}.choice.primary{background:var(--yellow)}
.mapbtn{position:absolute;z-index:25;right:18px;bottom:174px;width:62px;height:62px;border:3px solid var(--ink);border-radius:50%;background:#fff;box-shadow:4px 4px 0 var(--ink);font-size:26px}.actions{position:absolute;z-index:21;left:18px;bottom:174px;display:flex;gap:7px}.action{border:3px solid var(--ink);border-radius:12px;background:white;padding:9px 12px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;font-weight:bold}.action:disabled{opacity:.45}
.mini{position:absolute;z-index:40;inset:0;background:rgba(23,21,44,.82);display:none;align-items:center;justify-content:center;padding:20px}.mini.show{display:flex}.game-card{width:min(520px,100%);background:var(--cream);border:5px solid var(--ink);border-radius:24px;padding:18px;box-shadow:8px 8px 0 rgba(0,0,0,.25)}.game-card h2{margin:0 0 5px}.stars-game{height:230px;position:relative;background:#181a48;border:4px solid var(--ink);border-radius:15px;overflow:hidden;margin:12px 0}.star{position:absolute;width:38px;height:38px;border:0;background:transparent;font-size:34px;cursor:pointer;filter:drop-shadow(0 0 5px #fff)}.closemini{border:3px solid var(--ink);background:#fff;border-radius:10px;padding:8px 13px;font-weight:bold}
.touch{display:none}.toast{position:absolute;z-index:35;top:90px;left:50%;transform:translate(-50%,-90px);background:var(--ink);color:white;border-radius:12px;padding:9px 14px;font-weight:bold;transition:.35s}.toast.show{transform:translate(-50%,0)}
@media(max-width:650px){.topbar{top:8px;left:8px;right:8px}.brand{padding:5px 8px}.brand b{font-size:14px}.brand span{display:none}.stats{gap:4px}.stat{padding:5px 7px;font-size:12px}.dialogue{left:8px;right:8px;bottom:8px;padding:12px 10px 10px 82px;min-height:148px}.avatar{width:64px;height:64px;left:9px}.avatar:before{width:48px;height:48px}.avatar:after{width:54px;left:5px}.text{font-size:15px}.choice{font-size:13px;padding:7px 9px}.house-body{width:300px}.roof{bottom:430px;width:250px}.door{left:110px}.window.r{right:10px}.window.l{left:10px}.everton{right:13%;transform:scale(.82);transform-origin:bottom}.player{left:35%;transform:scale(.82);transform-origin:bottom}.actions{left:8px;bottom:164px}.action{padding:7px 8px;font-size:12px}.mapbtn{right:8px;bottom:164px;width:54px;height:54px}.touch{display:flex;position:absolute;z-index:22;left:50%;bottom:164px;transform:translateX(-50%);gap:5px}.touch button{width:38px;height:38px;border:3px solid var(--ink);border-radius:8px;background:rgba(255,255,255,.9);font-weight:bold}}
</style></head>
<body>
<div class="app" id="app">
<div class="sky"></div><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
<div class="world park" id="world"><div class="hills"></div>
<div class="house-art"><div class="roof"></div><div class="house-body"><div class="window l"></div><div class="window r"></div><div class="door"></div></div></div>
<div class="park-art"><div class="bench"><i></i><i></i></div><div class="fountain"></div></div>
<div class="tree t1"></div><div class="tree t2"></div></div>
<div class="topbar"><div class="brand"><b>Isaac & Everton</b><span>Nossa pequena história</span></div><div class="stats"><div class="stat">❤ <b id="love">35</b></div><div class="stat">⭐ <b id="memories">0</b>/5</div></div></div>
<div class="player" id="player"><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="body"></div><div class="head"></div><div class="hair"></div></div>
<div class="everton" id="everton"><div class="name-tag">Everton</div><div class="leg l"></div><div class="leg r"></div><div class="body"></div><div class="head"></div><div class="hair"></div></div>
<div class="actions"><button class="action" id="hug">Abraçar</button><button class="action" id="talk">Conversar</button></div>
<div class="touch"><button id="left">←</button><button id="right">→</button></div>
<button class="mapbtn" id="map" title="Trocar cenário">🗺️</button>
<div class="dialogue" id="dialogue"><div class="avatar" id="avatar"></div><div class="speaker" id="speaker">Everton</div><div class="text" id="text">Oi, Isaac! Aquele parque parece perfeito para criarmos uma nova memória hoje.</div><div class="choices" id="choices"></div></div>
<div class="toast" id="toast">Nova memória!</div>
<div class="mini" id="mini"><div class="game-card"><h2>Caça às estrelas</h2><div style="display:flex;justify-content:space-between"><span>Encontre as 5 estrelas com Everton</span><b id="score">0/5</b></div><div class="stars-game" id="starsgame"></div><button class="closemini" id="closemini">Fechar</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s), loveEl=$('#love'),memEl=$('#memories');let love=35,memories=0,scene='park',x=40,starCount=0;
const dialogues=[
 {s:'Everton',t:'Isaac, você quer fazer alguma coisa especial juntos hoje?',e:false,c:[['Sim! Vamos contar estrelas','stars'],['Que tal uma aventura no parque?','park'],['Só quero ficar perto de você','hug']]},
 {s:'Isaac',t:'Everton, às vezes fico pensando no que quero ser quando crescer.',e:false,c:[['Conversa com Everton','dream']]},
 {s:'Everton',t:'Eu acredito em você. Podemos descobrir isso devagar, um dia de cada vez.',e:true,c:[['Eu gosto de conversar assim','love'],['Vamos fazer outra memória','star2']]}
];let di=0;
function setText(s,t,eve=false){$('#speaker').textContent=s;$('#text').textContent=t;$('#avatar').className='avatar'+(eve?' eve':'')}
function choices(arr){const box=$('#choices');box.innerHTML='';arr.forEach(a=>{let b=document.createElement('button');b.className='choice'+(a[2]?' primary':'');b.textContent=a[0];b.onclick=()=>act(a[1]);box.appendChild(b)})}
function act(a){if(a==='stars'||a==='star2'){openMini()} if(a==='park'){scene='park';setScene();setText('Everton','Podemos explorar cada cantinho — eu vou andando ao seu lado.',true);choices([['Vamos buscar estrelas','stars'],['Meu lugar favorito é aqui','love']])} if(a==='hug'||a==='love'){love=Math.min(100,love+(a==='hug'?8:12));loveEl.textContent=love;setText('Everton','Esse momento já virou uma memória bonita.',true);choices([['Outra conversa','talk'],['Voltar ao parque','park']]);toast('Conexão +') } if(a==='dream'){setText('Everton','Não precisa ter todas as respostas agora. O importante é saber que não está sozinho.',true);choices([['Obrigado, Everton','love'],['Vamos sonhar juntos','stars']])} if(a==='talk'){di=(di+1)%dialogues.length;const d=dialogues[di];setText(d.s,d.t,d.e);choices(d.c.map(c=>[c[0],c[1]]))}}
function setScene(){const w=$('#world');w.className='world '+scene;if(scene==='park'){$('#everton').style.display='block'}else{$('#everton').style.display='none'}}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function openMini(){const m=$('#mini');m.classList.add('show');starCount=0;$('#score').textContent='0/5';const g=$('#starsgame');g.innerHTML='';for(let i=0;i<5;i++){let s=document.createElement('button');s.className='star';s.textContent='★';s.style.left=(8+Math.random()*84)+'%';s.style.top=(8+Math.random()*70)+'%';s.onclick=()=>{if(s.style.visibility==='hidden')return;s.style.visibility='hidden';starCount++;$('#score').textContent=starCount+'/5';if(starCount===5){memories=Math.min(5,memories+1);memEl.textContent=memories;love=Math.min(100,love+15);loveEl.textContent=love;toast('Memória criada!');setTimeout(()=>m.classList.remove('show'),700)}};g.appendChild(s)}}
$('#closemini').onclick=()=>$('#mini').classList.remove('show');$('#hug').onclick=()=>act('hug');$('#talk').onclick=()=>act('talk');
$('#map').onclick=()=>{scene=scene==='park'?'house':'park';setScene();toast(scene==='park'?'Parque':'Casa');};
function move(d){x=Math.max(5,Math.min(80,x+d));$('#player').style.left=x+'%'}$('#left').onclick=()=>move(-5);$('#right').onclick=()=>move(5);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-5);if(e.key==='ArrowRight'||e.key==='d')move(5)});
choices([['Vamos fazer uma memória','stars'],['Conversar um pouco','talk']]);setScene();
</script></body></html>
